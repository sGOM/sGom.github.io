      - heading "언제 쓰고 언제 안 쓰나" [level=2] [ref=f8e103]
      - paragraph [ref=f8e104]: 기본값을 바꿀 구체적인 이유가 없으면 기본값을 유지하는 편이 낫습니다. READ COMMITTED로 낮추면 잠금 경합이 줄어드는 대신 같은 트랜잭션 안에서 반복 조회한 값이 달라질 수 있으므로, 그 가능성을 코드가 감당할 수 있는지 먼저 따져야 합니다. SERIALIZABLE은 정합성이 절대적으로 중요한 짧은 트랜잭션에 한정해서 검토할 만합니다. 무엇보다, 어떤 DBMS를 쓰는지 확인하는 것이 격리 수준 표를 외우는 것보다 먼저입니다. 같은 이름의 격리 수준도 DBMS마다 구현이 다르기 때문입니다.
