            - /url: /tags/%ED%85%8C%EC%8A%A4%ED%8A%B8/
      - heading "왜 필요한가" [level=2] [ref=f9e22]
      - paragraph [ref=f9e23]:
        - text: 안쪽 메서드에서 발생한 예외를 바깥에서 try-catch로 잡았는데도, 최종 커밋 시점에
        - code [ref=f9e24]: UnexpectedRollbackException
        - text: 이 발생하며 전체가 실패하는 상황이 있습니다. 예외를 분명히 처리했는데 롤백이 되는 것이므로, 코드만 보면 이유가 드러나지 않습니다. 원인은
        - code [ref=f9e25]: "@Transactional"
        - text: 의 전파 속성과 rollback-only 표시에 있습니다.
      - heading "핵심 개념" [level=2] [ref=f9e26]
      - paragraph [ref=f9e27]:
        - code [ref=f9e28]: "@Transactional"
        - text: 의
        - code [ref=f9e29]: propagation
        - text: 속성은 메서드가 이미 진행 중인 트랜잭션을 만났을 때 어떻게 동작할지를 정합니다. 실무에서 주로 다루는 세 가지는 다음과 같습니다.
      - table [ref=f9e30]:
        - rowgroup [ref=f9e31]:
          - row [ref=f9e32]:
            - columnheader "전파 속성" [ref=f9e33]
            - columnheader "동작" [ref=f9e34]
        - rowgroup [ref=f9e35]:
          - row [ref=f9e36]:
            - cell "REQUIRED (기본값)" [ref=f9e37]
            - cell "진행 중인 트랜잭션이 있으면 참여하고, 없으면 새로 시작합니다." [ref=f9e38]
          - row [ref=f9e39]:
            - cell "REQUIRES_NEW" [ref=f9e40]
            - cell "진행 중인 트랜잭션을 일시 중단하고 항상 새 트랜잭션을 시작합니다." [ref=f9e41]
          - row [ref=f9e42]:
            - cell "NESTED" [ref=f9e43]
            - cell "진행 중인 트랜잭션이 있으면 세이브포인트를 사용해 중첩하고, 없으면 REQUIRED와 같이 새로 시작합니다." [ref=f9e44]
      - paragraph [ref=f9e45]: 나머지 네 가지는 다음과 같이 동작합니다.
      - list [ref=f9e46]:
        - listitem [ref=f9e47]:
          - strong [ref=f9e48]: SUPPORTS
          - text: ": 진행 중인 트랜잭션이 있으면 참여하고, 없으면 트랜잭션 없이 실행합니다."
        - listitem [ref=f9e49]:
          - strong [ref=f9e50]: MANDATORY
          - text: ": 진행 중인 트랜잭션이 반드시 있어야 하며, 없으면 예외가 발생합니다."
        - listitem [ref=f9e51]:
          - strong [ref=f9e52]: NEVER
          - text: ": 트랜잭션 없이 실행되어야 하며, 진행 중인 트랜잭션이 있으면 예외가 발생합니다."
        - listitem [ref=f9e53]:
          - strong [ref=f9e54]: NOT_SUPPORTED
          - text: ": 진행 중인 트랜잭션을 일시 중단하고 트랜잭션 없이 실행합니다."
      - heading "동작 원리" [level=2] [ref=f9e55]
      - paragraph [ref=f9e56]:
        - text: REQUIRED로 참여한 안쪽 메서드에서 예외가 발생하면, 그 예외가 프록시를 빠져나가는 순간 공유하고 있던(물리) 트랜잭션에 rollback-only 표시가 붙습니다. 바깥 메서드가 이 예외를 try-catch로 잡아 정상적으로 종료하더라도, rollback-only 표시는 그대로 남아 있으므로 커밋 시점에
        - code [ref=f9e57]: UnexpectedRollbackException
        - text: 이 발생하며 전체가 롤백됩니다. 이것이 “예외를 분명히 잡았는데 왜 롤백되는가”에 대한 답입니다. REQUIRED로 참여한 메서드들은 논리적으로는 여러 개의 트랜잭션이지만, 실제로는 하나의 물리 트랜잭션을 공유하기 때문에 그중 일부만 롤백하는 것은 불가능합니다.
      - paragraph [ref=f9e58]:
        - text: 함께 알아야 할 함정이 두 가지 더 있습니다. 첫째, Spring의
        - code [ref=f9e59]: "@Transactional"
        - text: 은 프록시 기반으로 동작하므로 같은 클래스 안에서 메서드를 직접 호출하는 자기 호출(self-invocation)에는 적용되지 않습니다. 프록시를 거치지 않기 때문입니다. 둘째, 기본 롤백 대상은 unchecked 예외(
        - code [ref=f9e60]: RuntimeException
        - text: 과 그 하위 클래스,
        - code [ref=f9e61]: Error
        - text: )이고, checked 예외는 기본적으로 롤백을 유발하지 않으므로 롤백시키려면
        - code [ref=f9e62]: rollbackFor
        - text: 속성을 지정해야 합니다.
      - heading "직접 확인" [level=2] [ref=f9e63]
      - paragraph [ref=f9e64]: 같은 시나리오 — 안쪽에서 예외가 발생하고 바깥이 try-catch로 잡는 경우 — 를 REQUIRED와 REQUIRES_NEW로 각각 실행한 테스트입니다. Spring Boot + Kotlin + Kotest 환경에서 검증했습니다.
      - paragraph [ref=f9e65]: REQUIRED로 참여한 경우, 안쪽 예외는 바깥에서 잡히지만 rollback-only 오염 때문에 커밋 시점에 실패합니다.
      - code [ref=f9e67]:
        - generic [ref=f9e68]: "When(\"안쪽이 예외를 던지고 바깥이 그 예외를 try-catch 로 삼키면\") {"
        - generic [ref=f9e69]: "Then(\"바깥은 정상 종료하지만 커밋 시점에 UnexpectedRollbackException 이 터지고 전부 롤백된다\") {"
        - generic [ref=f9e70]: // 안쪽 프록시를 예외가 빠져나가는 순간 공유 트랜잭션에 rollback-only 가 찍힌다.
        - generic [ref=f9e71]: // 바깥은 예외를 잡고 추가로 save() 까지 했지만 아무 의미가 없다.
        - generic [ref=f9e72]: "val exception = shouldThrow<UnexpectedRollbackException> {"
        - generic [ref=f9e73]: outerService.requiredCallingRequiredAndCatch()
        - generic [ref=f9e74]: "}"
        - generic [ref=f9e75]: exception.message!!.contains("rollback-only") shouldBe true
        - generic [ref=f9e76]: // 바깥의 저장 + 안쪽의 저장 + catch 후 복구 시도까지 전부 사라진다.
        - generic [ref=f9e77]: logsRepository.count() shouldBe 0
        - generic [ref=f9e78]: "}"
        - generic [ref=f9e79]: "}"
      - paragraph [ref=f9e80]: REQUIRES_NEW로 호출한 경우, 안쪽은 별도의 물리 트랜잭션이므로 안쪽만 롤백되고 바깥은 오염 없이 정상 커밋됩니다.
      - code [ref=f9e82]:
        - generic [ref=f9e83]: "When(\"안쪽이 예외를 던지고 바깥이 그 예외를 잡으면\") {"
        - generic [ref=f9e84]: "Then(\"안쪽만 롤백되고 바깥은 rollback-only 오염 없이 정상 커밋된다\") {"
        - generic [ref=f9e85]: // 같은 상황을 REQUIRED 로 하면 UnexpectedRollbackException 이 터졌다.
        - generic [ref=f9e86]: // REQUIRES_NEW 는 롤백 대상이 물리적으로 분리돼 있어 예외를 잡고 복구까지 할 수 있다.
        - generic [ref=f9e87]: outerService.requiredCallingRequiresNewAndCatch()
        - generic [ref=f9e88]: logsRepository.countByMessage(InnerService.INNER_MESSAGE) shouldBe 0
        - generic [ref=f9e89]: logsRepository.countByMessage(OuterService.OUTER_MESSAGE) shouldBe 1
        - generic [ref=f9e90]: logsRepository.countByMessage(OuterService.RECOVERY_MESSAGE) shouldBe 1
        - generic [ref=f9e91]: "}"
        - generic [ref=f9e92]: "}"
      - paragraph [ref=f9e93]:
        - text: "저장소:"
        - link "github.com/sGOM/spring-transactional-test" [ref=f9e94] [cursor=pointer]:
          - /url: https://github.com/sGOM/spring-transactional-test
      - heading "언제 쓰고 언제 안 쓰나" [level=2] [ref=f9e95]
      - paragraph [ref=f9e96]: REQUIRES_NEW는 본 작업이 실패하더라도 반드시 남겨야 하는 기록 — 로그, 이력, 알림 발송 기록 — 을 저장할 때 씁니다. 다만 별도의 커넥션을 사용하므로 커넥션 풀 크기를 함께 고려해야 하고, 부모가 잠근 행을 자식이 다시 잠그려 하면 자기 자신과 데드락(self-deadlock)에 빠질 수 있다는 점을 주의해야 합니다. NESTED는 세이브포인트를 기반으로 하므로 자식만 부분적으로 롤백할 수 있지만, 바깥 트랜잭션이 롤백되면 세이브포인트 이전 상태를 포함해 전체가 함께 롤백됩니다.
