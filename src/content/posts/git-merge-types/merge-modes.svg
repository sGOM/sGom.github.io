<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a" />
    </marker>
    <marker id="ahg2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6b6b6b" />
    </marker>
  </defs>
  <rect x="10" y="10" width="840" height="540" rx="16" fill="#f6f8fa" stroke="#e5e5e5" />
  <text x="430" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">갈라진 히스토리를 합치는 세 가지 결과</text>
  <text x="430" y="56" text-anchor="middle" font-size="10.5" fill="#6b6b6b">출발 상태는 모두 같다. main = A→D, feature = A→B→C</text>

  <!-- row 1: merge commit -->
  <rect x="40" y="72" width="780" height="140" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5" />
  <text x="62" y="104" font-size="13" font-weight="700" fill="#1a1a1a">머지 커밋</text>
  <text x="62" y="126" font-size="10.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#1a1a1a">git merge feature</text>
  <text x="62" y="152" font-size="10" fill="#6b6b6b">부모가 둘인 커밋 M을 새로 만든다.</text>
  <text x="62" y="168" font-size="10" fill="#6b6b6b">B·C는 해시 그대로 남는다.</text>

  <line x1="295" y1="133" x2="352" y2="116" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah2)" />
  <line x1="295" y1="151" x2="352" y2="168" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah2)" />
  <line x1="386" y1="108" x2="431" y2="108" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah2)" />
  <line x1="386" y1="176" x2="541" y2="176" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah2)" />
  <line x1="463" y1="119" x2="547" y2="165" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah2)" />
  <circle cx="280" cy="142" r="16" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5" />
  <text x="280" y="147" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">A</text>
  <circle cx="370" cy="108" r="16" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="370" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">B</text>
  <circle cx="450" cy="108" r="16" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="450" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">C</text>
  <circle cx="370" cy="176" r="16" fill="#e5e5e7" stroke="#6b6b6b" stroke-width="1.5" />
  <text x="370" y="181" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">D</text>
  <circle cx="562" cy="176" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="562" y="181" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">M</text>
  <text x="280" y="203" text-anchor="middle" font-size="9.5" fill="#6b6b6b">merge base</text>
  <text x="450" y="84" text-anchor="middle" font-size="10" font-weight="700" fill="#2563eb">feature (theirs)</text>
  <text x="370" y="203" text-anchor="middle" font-size="9.5" fill="#6b6b6b">ours</text>
  <text x="562" y="203" text-anchor="middle" font-size="10" font-weight="700" fill="#2563eb">main</text>
  <text x="600" y="180" font-size="9.5" fill="#6b6b6b">부모: D, C</text>

  <!-- row 2: squash -->
  <rect x="40" y="228" width="780" height="140" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5" />
  <text x="62" y="260" font-size="13" font-weight="700" fill="#1a1a1a">스쿼시</text>
  <text x="62" y="282" font-size="10.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#1a1a1a">git merge --squash feature</text>
  <text x="62" y="298" font-size="10.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#1a1a1a">git commit</text>
  <text x="62" y="324" font-size="10" fill="#6b6b6b">B·C의 변경 내용만 커밋 하나로</text>
  <text x="62" y="340" font-size="10" fill="#6b6b6b">눌러 담는다. 부모는 하나다.</text>

  <line x1="295" y1="289" x2="352" y2="272" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah2)" />
  <line x1="295" y1="307" x2="352" y2="324" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah2)" />
  <line x1="386" y1="264" x2="431" y2="264" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah2)" />
  <line x1="386" y1="332" x2="461" y2="332" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah2)" />
  <line x1="452" y1="281" x2="472" y2="313" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ahg2)" />
  <circle cx="280" cy="298" r="16" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5" />
  <text x="280" y="303" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">A</text>
  <circle cx="370" cy="264" r="16" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="370" y="269" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">B</text>
  <circle cx="450" cy="264" r="16" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="450" y="269" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">C</text>
  <circle cx="370" cy="332" r="16" fill="#e5e5e7" stroke="#6b6b6b" stroke-width="1.5" />
  <text x="370" y="337" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">D</text>
  <circle cx="482" cy="332" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="482" y="337" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">S</text>
  <text x="450" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#2563eb">feature</text>
  <text x="482" y="359" text-anchor="middle" font-size="10" font-weight="700" fill="#2563eb">main</text>
  <text x="512" y="292" font-size="9.5" fill="#6b6b6b">변경 내용만 옮긴다. 부모로 잇지 않는다</text>
  <text x="512" y="336" font-size="9.5" fill="#6b6b6b">부모: D 하나</text>

  <!-- row 3: rebase -->
  <rect x="40" y="384" width="780" height="140" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5" />
  <text x="62" y="416" font-size="13" font-weight="700" fill="#1a1a1a">리베이스</text>
  <text x="62" y="438" font-size="10.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#1a1a1a">git switch feature</text>
  <text x="62" y="454" font-size="10.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#1a1a1a">git rebase main</text>
  <text x="62" y="480" font-size="10" fill="#6b6b6b">B·C를 D 위에 새 커밋으로 다시</text>
  <text x="62" y="496" font-size="10" fill="#6b6b6b">만든다. 해시가 바뀐다.</text>

  <line x1="293" y1="459" x2="402" y2="429" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="436" y1="418" x2="472" y2="418" stroke="#c9c9c9" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="420" cy="418" r="16" fill="#f6f8fa" stroke="#c9c9c9" stroke-width="1.5" />
  <text x="420" y="423" text-anchor="middle" font-size="11" font-weight="700" fill="#9a9a9a">B</text>
  <circle cx="490" cy="418" r="16" fill="#f6f8fa" stroke="#c9c9c9" stroke-width="1.5" />
  <text x="490" y="423" text-anchor="middle" font-size="11" font-weight="700" fill="#9a9a9a">C</text>
  <text x="455" y="396" text-anchor="middle" font-size="9.5" fill="#9a9a9a">원래 커밋. 브랜치가 더 이상 가리키지 않는다</text>

  <line x1="422" y1="434" x2="446" y2="450" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ahg2)" />
  <line x1="492" y1="434" x2="534" y2="450" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ahg2)" />

  <line x1="296" y1="470" x2="341" y2="470" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah2)" />
  <line x1="376" y1="470" x2="431" y2="470" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah2)" />
  <line x1="466" y1="470" x2="521" y2="470" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah2)" />
  <circle cx="280" cy="470" r="16" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5" />
  <text x="280" y="475" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">A</text>
  <circle cx="360" cy="470" r="16" fill="#e5e5e7" stroke="#6b6b6b" stroke-width="1.5" />
  <text x="360" y="475" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">D</text>
  <circle cx="450" cy="470" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="450" y="475" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">B&#39;</text>
  <circle cx="540" cy="470" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="540" y="475" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">C&#39;</text>
  <text x="360" y="497" text-anchor="middle" font-size="10" font-weight="700" fill="#2563eb">main</text>
  <text x="540" y="497" text-anchor="middle" font-size="10" font-weight="700" fill="#2563eb">feature</text>
  <text x="575" y="474" font-size="9.5" fill="#6b6b6b">이제 main에서 merge하면 fast-forward</text>
</svg>
