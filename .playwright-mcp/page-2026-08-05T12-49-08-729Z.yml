      - paragraph [ref=f8e54]: 세 이상 현상의 정의는 다음과 같습니다.
      - list [ref=f8e55]:
        - listitem [ref=f8e56]:
          - strong [ref=f8e57]: Dirty Read
          - text: ": 아직 커밋되지 않은 다른 트랜잭션의 변경을 읽는 현상입니다."
        - listitem [ref=f8e58]:
          - strong [ref=f8e59]: Non-Repeatable Read
          - text: ": 같은 트랜잭션 안에서 같은 행을 두 번 읽었을 때 값이 달라지는 현상입니다."
        - listitem [ref=f8e60]:
          - strong [ref=f8e61]: Phantom Read
          - text: ": 같은 조건으로 두 번 조회했을 때 행의 개수가 달라지는 현상입니다."
      - heading "동작 원리" [level=2] [ref=f8e62]
      - paragraph [ref=f8e63]: 위 표는 SQL 표준이 정의한 최소 기준일 뿐이고, 실제 DBMS의 동작은 이 표와 정확히 일치하지 않습니다. 표를 그대로 외워서 실무에 적용하면 틀리는 경우가 있는 이유입니다.
      - paragraph [ref=f8e64]: MySQL InnoDB는 기본 격리 수준이 REPEATABLE READ입니다. 표준 정의상 REPEATABLE READ는 Phantom Read를 허용하지만, InnoDB는 갭 락(gap lock)과 넥스트키 락(next-key lock)을 사용해 잠금을 동반하는 읽기(locking read)에서 Phantom Read를 상당 부분 막습니다.
      - paragraph [ref=f8e65]: PostgreSQL은 기본 격리 수준이 READ COMMITTED이고, MVCC(다중 버전 동시성 제어) 기반으로 동작합니다. MVCC는 읽는 트랜잭션과 쓰는 트랜잭션이 서로 다른 버전의 행을 보게 하므로, 읽기가 쓰기를 막지 않습니다. PostgreSQL의 REPEATABLE READ는 트랜잭션 시작 시점의 스냅샷을 보는 방식으로 구현되어 있어 Phantom Read가 발생하지 않는 대신, 같은 데이터를 동시에 수정하는 충돌이 생기면 직렬화 실패(serialization failure)로 트랜잭션이 종료되어 애플리케이션이 재시도 로직을 갖춰야 합니다.
      - heading "직접 확인" [level=2] [ref=f8e66]
      - paragraph [ref=f8e67]:
        - text: 아래는 H2(2.x, MVStore 모드) 환경에서 REPEATABLE READ를 검증한 테스트입니다. H2도 스냅샷 방식으로 REPEATABLE READ를 구현하고 있어, 읽기 트랜잭션이 시작된 후 다른 트랜잭션이 새 행을 INSERT하고 커밋해도 그 행이 보이지 않는지를 확인합니다.
