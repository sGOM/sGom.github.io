<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <rect x="10" y="10" width="840" height="440" rx="16" fill="#f6f8fa" stroke="#e5e5e5" />

  <text x="430" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">JVM 런타임 데이터 영역</text>
  <text x="430" y="54" text-anchor="middle" font-size="12" fill="#6b6b6b">공유 영역 — 모든 스레드가 함께 사용</text>

  <!-- Shared: Method Area / Heap -->
  <rect x="110" y="64" width="300" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
  <text x="260" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">메서드 영역</text>
  <text x="260" y="110" text-anchor="middle" font-size="11" fill="#6b6b6b">(Method Area / Metaspace)</text>
  <text x="260" y="128" text-anchor="middle" font-size="11" fill="#1a1a1a">클래스 구조 · 상수 풀 · static 변수</text>

  <rect x="450" y="64" width="300" height="80" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
  <text x="600" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">힙</text>
  <text x="600" y="110" text-anchor="middle" font-size="11" fill="#6b6b6b">(Heap)</text>
  <text x="600" y="128" text-anchor="middle" font-size="11" fill="#1a1a1a">객체 인스턴스 · 배열</text>

  <line x1="60" y1="160" x2="800" y2="160" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="430" y="180" text-anchor="middle" font-size="12" fill="#6b6b6b">스레드별 영역 — 스레드마다 독립적으로 생성</text>

  <!-- Thread 1 -->
  <rect x="110" y="195" width="210" height="225" rx="10" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="215" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Thread 1</text>

  <rect x="130" y="222" width="170" height="58" rx="8" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="215" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">PC 레지스터</text>
  <text x="215" y="262" text-anchor="middle" font-size="9.5" fill="#6b6b6b">(PC Register)</text>

  <rect x="130" y="288" width="170" height="58" rx="8" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="215" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">JVM 스택</text>
  <text x="215" y="328" text-anchor="middle" font-size="9.5" fill="#6b6b6b">(JVM Stack)</text>

  <rect x="130" y="354" width="170" height="58" rx="8" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="215" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">네이티브 메서드 스택</text>
  <text x="215" y="394" text-anchor="middle" font-size="9.5" fill="#6b6b6b">(Native Method Stack)</text>

  <!-- Thread 2 -->
  <rect x="340" y="195" width="210" height="225" rx="10" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="445" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Thread 2</text>

  <rect x="360" y="222" width="170" height="58" rx="8" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="445" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">PC 레지스터</text>
  <text x="445" y="262" text-anchor="middle" font-size="9.5" fill="#6b6b6b">(PC Register)</text>

  <rect x="360" y="288" width="170" height="58" rx="8" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="445" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">JVM 스택</text>
  <text x="445" y="328" text-anchor="middle" font-size="9.5" fill="#6b6b6b">(JVM Stack)</text>

  <rect x="360" y="354" width="170" height="58" rx="8" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="445" y="378" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">네이티브 메서드 스택</text>
  <text x="445" y="394" text-anchor="middle" font-size="9.5" fill="#6b6b6b">(Native Method Stack)</text>

  <!-- more threads indicator -->
  <text x="650" y="300" text-anchor="middle" font-size="20" font-weight="700" fill="#6b6b6b">⋯</text>
  <text x="650" y="322" text-anchor="middle" font-size="11" fill="#6b6b6b">스레드 수만큼</text>
  <text x="650" y="337" text-anchor="middle" font-size="11" fill="#6b6b6b">반복 생성</text>

  <text x="430" y="440" text-anchor="middle" font-size="10" fill="#6b6b6b">실선 상자: 값을 담는 영역 · 점선 테두리: 스레드 단위로 묶은 그룹</text>
</svg>
