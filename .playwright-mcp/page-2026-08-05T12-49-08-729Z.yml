      - heading "왜 필요한가" [level=2] [ref=f8e22]
      - paragraph [ref=f8e23]: 같은 조회를 두 번 실행했는데 결과가 다르면, 코드에는 문제가 없는데도 원인을 찾지 못하는 상황이 생깁니다. 한 트랜잭션 안에서 같은 행을 두 번 읽었을 뿐인데 값이 바뀌어 있거나, 같은 조건으로 두 번 조회했는데 행의 개수가 달라지는 경우가 그렇습니다. 로직을 아무리 다시 봐도 이상한 곳이 없는 이유는, 문제가 애플리케이션 코드가 아니라 트랜잭션 격리 수준에 있기 때문입니다. 격리 수준을 모르면 이런 현상을 재현할 수도, 설명할 수도 없습니다.
      - heading "핵심 개념" [level=2] [ref=f8e24]
      - paragraph [ref=f8e25]: 격리 수준은 동시에 실행되는 트랜잭션이 서로의 변경을 얼마나 볼 수 있는지를 정하는 설정입니다. SQL 표준은 4단계를 정의하고, 각 단계가 허용하거나 막는 이상 현상을 아래처럼 규정합니다.
