<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a" />
    </marker>
  </defs>
  <rect x="10" y="10" width="840" height="380" rx="16" fill="#f6f8fa" stroke="#e5e5e5" />
  <text x="430" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">fast-forward는 언제 되는가</text>

  <!-- left panel -->
  <rect x="40" y="60" width="370" height="310" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5" />
  <text x="225" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">main이 feature의 조상일 때</text>
  <text x="225" y="106" text-anchor="middle" font-size="10.5" fill="#6b6b6b">갈라진 커밋이 없다</text>

  <text x="66" y="136" font-size="10" fill="#6b6b6b">병합 전</text>
  <line x1="127" y1="160" x2="176" y2="160" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)" />
  <line x1="212" y1="160" x2="261" y2="160" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)" />
  <circle cx="110" cy="160" r="17" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5" />
  <text x="110" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">A</text>
  <circle cx="195" cy="160" r="17" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="195" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">B</text>
  <circle cx="280" cy="160" r="17" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="280" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">C</text>
  <text x="110" y="192" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563eb">main</text>
  <text x="280" y="192" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563eb">feature</text>

  <line x1="225" y1="206" x2="225" y2="242" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)" />
  <text x="240" y="228" font-size="10.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#1a1a1a">git merge feature</text>

  <text x="66" y="258" font-size="10" fill="#6b6b6b">병합 후</text>
  <line x1="127" y1="282" x2="176" y2="282" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)" />
  <line x1="212" y1="282" x2="261" y2="282" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)" />
  <circle cx="110" cy="282" r="17" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5" />
  <text x="110" y="287" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">A</text>
  <circle cx="195" cy="282" r="17" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="195" y="287" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">B</text>
  <circle cx="280" cy="282" r="17" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="280" y="287" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">C</text>
  <text x="280" y="314" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563eb">main, feature</text>

  <text x="225" y="344" text-anchor="middle" font-size="10.5" fill="#1a1a1a">커밋을 만들지 않는다. main 포인터만 C로 옮긴다</text>

  <!-- right panel -->
  <rect x="450" y="60" width="370" height="310" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="1.5" />
  <text x="635" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">갈라졌을 때</text>
  <text x="635" y="106" text-anchor="middle" font-size="10.5" fill="#6b6b6b">main에만 있는 커밋 D가 생겼다</text>

  <line x1="519" y1="170" x2="576" y2="150" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)" />
  <line x1="519" y1="190" x2="576" y2="210" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)" />
  <line x1="607" y1="145" x2="648" y2="145" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)" />
  <circle cx="505" cy="180" r="17" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.5" />
  <text x="505" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">A</text>
  <circle cx="590" cy="145" r="17" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="590" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">B</text>
  <circle cx="665" cy="145" r="17" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5" />
  <text x="665" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">C</text>
  <circle cx="590" cy="215" r="17" fill="#e5e5e7" stroke="#6b6b6b" stroke-width="1.5" />
  <text x="590" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">D</text>
  <text x="665" y="120" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563eb">feature</text>
  <text x="590" y="245" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563eb">main</text>

  <rect x="480" y="266" width="310" height="30" rx="6" fill="#f6f8fa" stroke="#e5e5e5" />
  <text x="635" y="285" text-anchor="middle" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#1a1a1a">git merge --ff-only feature</text>
  <text x="635" y="316" text-anchor="middle" font-size="10.5" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" fill="#b91c1c">fatal: Not possible to fast-forward, aborting.</text>
  <text x="635" y="344" text-anchor="middle" font-size="10.5" fill="#1a1a1a">main이 feature의 조상이 아니라 포인터만으로는 합칠 수 없다</text>
</svg>
